name: FoodStore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend CI (Lint, Test, Build)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: foodstore_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Run Prisma Migrations (Test DB)
        run: npx prisma db push
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/foodstore_test

      - name: Run Backend Tests
        run: npm run test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/foodstore_test
          JWT_SECRET: super_secret_jwt_key_for_testing_12345
          JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_for_testing_12345
          CORS_ORIGINS: http://localhost:5173

  frontend-test:
    name: Frontend CI (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Frontend Tests
        run: npm run test
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend
